name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      country:
        description: Data set to refresh
        required: true
        default: all
        type: choice
        options: [all, england, japan, china]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: transfer-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install data-builder dependencies
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Refresh selected data
        if: github.event_name != 'push'
        env:
          TARGET_COUNTRY: ${{ github.event.inputs.country || 'all' }}
        run: |
          # A blocked source (Transfermarkt often blocks CI IPs) must not fail
          # the whole job: skip that builder, keep its last-good data, deploy.
          refresh () { python "$1" || echo "::warning::$1 failed (source blocked?) — keeping existing data"; }
          case "$TARGET_COUNTRY" in
            all)
              refresh build_data.py
              refresh build_japan.py
              refresh build_china.py
              ;;
            england) refresh build_data.py ;;
            japan) refresh build_japan.py ;;
            china) refresh build_china.py ;;
          esac

      - name: Commit refreshed CSV and browser data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *-transfers.csv data-*.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh transfer data"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify Sunday-centred report
        run: node --test tests/report-week.test.cjs tests/sofascore-season.test.cjs

      - name: Refresh Japanese player scheduled fixtures
        if: github.event_name != 'push'
        run: node refresh-fixtures.cjs || echo "::warning::Fixture source unavailable; preserving last verified schedule"

      - name: Refresh source-confirmed match venues
        if: github.event_name != 'push'
        run: node refresh-venues.cjs || echo "::warning::Venue source unavailable; preserving last verified venues"

      - name: Refresh Sofascore season ratings
        if: github.event_name != 'push'
        run: node refresh-sofascore.cjs || echo "::warning::Sofascore unavailable; preserving last verified season ratings"

      - name: Refresh published league season totals
        if: github.event_name != 'push'
        run: node refresh-season-totals.cjs || echo "::warning::Season stats unavailable; preserving last verified totals"

      - name: Commit updated fixture snapshot
        if: github.event_name != 'push'
        run: |
          git add fixtures.json fixture-venues.json sofascore-season.json season-totals.json japanese-players.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Japanese player fixtures, venues and season ratings"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
